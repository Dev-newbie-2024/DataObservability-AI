[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "data-observability-ai"
version = "0.1.0"
description = "Dataset-Agnostic, Cost-Aware and Self-Healing Data Observability Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "VTU ISE Project Team", email = "team@example.com" },
]
keywords = ["data-observability", "airflow", "kafka", "snowflake", "dbt", "great-expectations", "evidently"]

dependencies = [
    # API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    # Config & Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    # Snowflake
    "snowflake-connector-python>=3.10.0",
    "snowflake-sqlalchemy>=1.6.0",
    # Kafka
    "confluent-kafka>=2.4.0",
    # Data Processing
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=16.0.0",
    # Observability
    "great-expectations>=0.18.0",
    "evidently>=0.4.30",
    # Forecasting
    "prophet>=1.1.5",
    "scipy>=1.13.0",
    # Dashboard
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    # Utilities
    "structlog>=24.2.0",
    "tenacity>=8.3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]
airflow = [
    "apache-airflow>=2.9.3",
    "apache-airflow-providers-snowflake>=5.5.0",
    "apache-airflow-providers-apache-kafka>=1.3.0",
]
dbt = [
    "dbt-core>=1.8.0",
    "dbt-snowflake>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "ai_agents*", "dashboard*", "config*"]

# ─── Ruff (Linter + Formatter) ──────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "ai_agents", "dashboard", "airflow", "config", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "ANN", # flake8-annotations (type hints)
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101", # Missing type annotation for `self`
    "ANN102", # Missing type annotation for `cls`
    "S101",   # Use of `assert` (needed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S"]
"airflow/dags/*" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "ai_agents", "dashboard", "config"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── Mypy (Type Checker) ────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["tests/", "dbt/", "airflow/dags/"]

# ─── Pytest ─────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--tb=short",
    "-v",
]
markers = [
    "unit: Unit tests (no external services)",
    "integration: Integration tests (requires Docker stack)",
    "e2e: End-to-end tests (requires full stack + Snowflake)",
    "slow: Tests that take longer than 10 seconds",
]

# ─── Coverage ────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["backend", "ai_agents", "config"]
omit = ["tests/*", "*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 70
