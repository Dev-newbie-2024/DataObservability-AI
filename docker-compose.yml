# ════════════════════════════════════════════════════════════════════════════
# DataObservability-AI — Docker Compose
# Services: postgres (airflow metadata), kafka, kafka-ui,
#           airflow-init, airflow-webserver, airflow-scheduler,
#           backend, agents, dashboard
# ════════════════════════════════════════════════════════════════════════════

# ─── Airflow common anchor ────────────────────────────────────────────────────
# Shared by airflow-init, airflow-webserver, airflow-scheduler.
# Uses the official apache/airflow:2.9.3-python3.12 image built from
# airflow/Dockerfile with LocalExecutor + PostgreSQL metadata backend.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  env_file:
    - .env
  environment:
    # ── Core ──────────────────────────────────────────────────────────────
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY:-}
    # ── Database — PostgreSQL metadata backend ─────────────────────────────
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    # ── Webserver ─────────────────────────────────────────────────────────
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY:-change_me_in_production}
    # ── API auth ──────────────────────────────────────────────────────────
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    # ── Python path — allows DAGs to import backend/config packages ───────
    PYTHONPATH: /opt/airflow
    # ── Snowflake connection (used by DAGs via hooks) ─────────────────────
    SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
    SNOWFLAKE_USER: ${SNOWFLAKE_USER}
    SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
    SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-OBSERVABILITY_DB}
    SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-COMPUTE_WH}
    SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-SYSADMIN}
    # ── Kafka connection ──────────────────────────────────────────────────
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./airflow/operators:/opt/airflow/operators
    - ./airflow/sensors:/opt/airflow/sensors
    - ./airflow/hooks:/opt/airflow/hooks
    - ./airflow/plugins:/opt/airflow/plugins
    - ./airflow/logs:/opt/airflow/logs
    - ./backend:/opt/airflow/backend
    - ./config:/opt/airflow/config
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
  networks:
    - observability-net

services:

  # ─── Kafka (KRaft mode — no ZooKeeper) ────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: obs_kafka
    hostname: kafka
    ports:
      - "9092:9092"   # Internal (container-to-container)
      - "9093:9093"   # External (host access)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"  # Fixed cluster ID for KRaft
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - observability-net

  # ─── Kafka UI ─────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: obs_kafka_ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - observability-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Kafka Topic Initialiser ───────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: obs_kafka_init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Creating Kafka topics...' &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic raw.data.events      --partitions 6 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic schema.events        --partitions 2 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic quality.events       --partitions 4 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic drift.events         --partitions 2 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic cost.events          --partitions 2 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic heal.commands        --partitions 2 --replication-factor 1 &&
      echo 'All topics created successfully.'
      "
    networks:
      - observability-net

  # ─── PostgreSQL — Airflow metadata database (internal only) ─────────────────
  postgres:
    image: postgres:15-alpine
    container_name: obs_airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - observability-net
    restart: unless-stopped

  # ─── Airflow Init (one-shot) ───────────────────────────────────────────────
  airflow-init:
    <<: *airflow-common
    container_name: obs_airflow_init
    # Passes commands to the official /entrypoint which activates the Airflow
    # virtualenv before executing. No custom entrypoint required.
    command: >
      bash -c "
        airflow db migrate &&
        airflow users create
          --username $${_AIRFLOW_WWW_USER_USERNAME:-admin}
          --password $${_AIRFLOW_WWW_USER_PASSWORD:-admin}
          --firstname Admin
          --lastname User
          --role Admin
          --email admin@example.com
          2>/dev/null || true &&
        echo 'Airflow init complete.'
      "
    restart: "no"

  # ─── Airflow Webserver ─────────────────────────────────────────────────────
  airflow-webserver:
    <<: *airflow-common
    container_name: obs_airflow_webserver
    ports:
      - "8081:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─── Airflow Scheduler ────────────────────────────────────────────────────
  airflow-scheduler:
    <<: *airflow-common
    container_name: obs_airflow_scheduler
    command: scheduler
    healthcheck:
      # --allow-multiple is required in Airflow 2.9+ when scheduler is restarted
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --allow-multiple || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # ─── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: obs_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - observability-net
    restart: unless-stopped

  # ─── AI Agents ────────────────────────────────────────────────────────────
  agents:
    build:
      context: .
      dockerfile: ai_agents/Dockerfile
    container_name: obs_agents
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      BACKEND_URL: http://backend:8000
    volumes:
      - ./ai_agents:/app/ai_agents
      - ./config:/app/config
    depends_on:
      kafka:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - observability-net
    restart: unless-stopped

  # ─── Streamlit Dashboard ──────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    container_name: obs_dashboard
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
      AIRFLOW_URL: http://localhost:8081
    volumes:
      - ./dashboard:/app/dashboard
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - observability-net
    restart: unless-stopped

# ─── Networks ─────────────────────────────────────────────────────────────────
networks:
  observability-net:
    driver: bridge
    name: observability-net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  kafka-data:
    name: obs_kafka_data
  airflow-pg:
    name: obs_airflow_pg
