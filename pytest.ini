[pytest]
# ── Environment variables for unit tests (no real Snowflake or Kafka needed) ──
env =
    APP_ENV=development
    SNOWFLAKE_ACCOUNT=test_account.us-east-1
    SNOWFLAKE_USER=test_user
    SNOWFLAKE_PASSWORD=test_password
    SNOWFLAKE_DATABASE=TEST_DB
    SNOWFLAKE_WAREHOUSE=TEST_WH
    SNOWFLAKE_ROLE=SYSADMIN
    KAFKA_BOOTSTRAP_SERVERS=localhost:9092
    LOG_LEVEL=WARNING

# ── Test discovery ─────────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Markers ────────────────────────────────────────────────────────────────────
markers =
    unit: Pure unit tests (no external services)
    integration: Tests requiring real Snowflake / Kafka connections
    e2e: End-to-end tests requiring a running stack

# ── Output ─────────────────────────────────────────────────────────────────────
addopts = -ra -q
